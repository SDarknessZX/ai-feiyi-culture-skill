services:
  - type: web
    name: ai-feiyi-culture-skill
    runtime: node
    plan: free
    region: singapore
    buildCommand: python3 -m venv .venv && .venv/bin/python -m pip install -r requirements-face-detect.txt && npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: MODEL_PROVIDER
        value: ark
      - key: CREATE_RATE_LIMIT
        value: 20
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: ARK_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: ARK_VIDEO_MODEL
        value: doubao-seedance-2-0-mini-260615
      - key: ARK_VIDEO_RESOLUTION
        value: 720p
      - key: ARK_IMAGE_MODEL
        value: doubao-seedream-5-0-260128
      - key: ARK_IMAGE_SIZE
        value: 2K
      - key: ARK_IMAGE_WATERMARK
        value: true
      - key: ARK_LLM_MODEL
        value: doubao-seed-2-0-mini-260428
      - key: CORS_ORIGIN
        value: https://aibox.aibcicloud.com,https://ai-feiyi-culture-skill.onrender.com
      - key: TOS_REGION
        value: cn-beijing
      - key: TOS_ENDPOINT
        value: tos-cn-beijing.volces.com
      - key: ARK_API_KEY
        sync: false
      - key: ARK_IMAGE_API_KEY
        sync: false
      - key: ARK_LLM_API_KEY
        sync: false
      - key: FACE_DETECT_PYTHON
        value: .venv/bin/python
      - key: TOS_ACCESS_KEY_ID
        sync: false
      - key: TOS_SECRET_ACCESS_KEY
        sync: false
      - key: TOS_BUCKET
        sync: false
      - key: TOS_PUBLIC_BASE_URL
        sync: false
      - key: MIGU_AIGC_APP_ID
        sync: false
      - key: MIGU_AIGC_APP_SECRET
        sync: false
      - key: MIGU_CHANNEL_CODE
        sync: false
      - key: MIGU_PROJECT_ID
        sync: false
      - key: MIGU_RELEASE_ID
        sync: false
      - key: MIGU_WATERMARK_ID
        sync: false
      - key: MIGU_CALLBACK_URL
        sync: false
      - key: MIGU_CHANNEL_LOGIN_SIGN_KEY
        sync: false
      - key: MIGU_CHANNEL_LOGIN_KEY
        sync: false
      - key: MIGU_CHANNEL_LOGIN_MSISDN
        sync: false
      - key: MIGU_CHANNEL_LOGIN_TYPE
        sync: false
      - key: MIGU_CHANNEL_LOGIN_CALLBACK_URL
        sync: false
      - key: ALIBABA_CLOUD_ACCESS_KEY_ID
        sync: false
      - key: ALIBABA_CLOUD_ACCESS_KEY_SECRET
        sync: false
      - key: ALIYUN_SMS_SIGN_NAME
        sync: false
      - key: ALIYUN_SMS_TEMPLATE_CODE
        sync: false
      - key: SMS_CHALLENGE_SECRET
        generateValue: true
      - key: SMS_SEND_RATE_LIMIT
        value: 5
      - key: SMS_SEND_RATE_LIMIT_WINDOW_MS
        value: 600000
      - key: SMS_VERIFY_RATE_LIMIT
        value: 10
      - key: SMS_VERIFY_RATE_LIMIT_WINDOW_MS
        value: 600000
      - key: MIGU_TOKEN_GATING_ENABLED
        sync: false
      - key: MIGU_API_TIMEOUT_MS
        value: 20000
      - key: MIGU_MODEL_VALUE_COSTUME
        sync: false
      - key: MIGU_MODEL_VALUE_FOOD
        sync: false
      - key: MIGU_MODEL_VALUE_PAINTING
        sync: false
      - key: AUDIT_API_BASE_URL
        sync: false
      - key: AUDIT_ACCOUNT
        sync: false
      - key: AUDIT_APP_KEY
        sync: false
      - key: AUDIT_CALLBACK_NAME
        sync: false
      - key: VITE_BYPASS_MIGU_LOGIN
        value: false
      - key: VITE_SERVICE_PROVIDER_NAME
        sync: false
      - key: VITE_PRIVACY_POLICY_URL
        sync: false
      - key: VITE_MIGU_AIGC_APP_ID
        sync: false
      - key: VITE_MIGU_PROJECT_ID
        sync: false
      - key: VITE_MIGU_CHANNEL_CODE
        sync: false
      - key: VITE_AMBER_ACCOUNT_ID
        sync: false
      - key: VITE_AMBER_UPLOAD_URL
        sync: false
